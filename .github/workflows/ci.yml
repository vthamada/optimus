name: Windows validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Optimus.slnx --locked-mode
      - name: Build desktop and CLI
        run: dotnet build Optimus.slnx --configuration Release --no-restore --disable-build-servers
      - name: Test workflow and storage boundaries
        run: dotnet test tests/Optimus.Tests/Optimus.Tests.csproj --configuration Release --no-build --no-restore --logger trx
